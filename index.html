            { id: 22, type: "mc", isRtl: false, text: "Kata tanya \"مَنْ\" (Man) dalam Bahasa Indonesia memiliki arti ....", options: [{id: "A", text: "Apa"}, {id: "B", text: "Dari mana"}, {id: "C", text: "Bagaimana"}, {id: "D", text: "Siapa"}], answer: "D" },
            { id: 23, type: "mc", isRtl: true, text: "إِمْلَا الْفَرَاغَ بِاسْمِ الْإِشَارَةِ الْمُنَاسِبِ:\n\".... عُمَرُ، هُوَ أَمِينُ الْمَكْتَبَةِ.\"", options: [{id: "A", text: "تِلْكَ"}, {id: "B", text: "هَذِهِ"}, {id: "C", text: "ذَلِكَ"}, {id: "D", text: "هِيَ"}], answer: "C" },
            { id: 24, type: "mc", isRtl: false, text: "Ungkapan \"كَيْفَ حَالُكَ؟\" (Kayfa haaluka?) digunakan untuk menanyakan ....", options: [{id: "A", text: "Kabar / Keadaan seseorang"}, {id: "B", text: "Asal kota seseorang"}, {id: "C", text: "Nama seseorang"}, {id: "D", text: "Pekerjaan / Profesi seseorang"}], answer: "A" },
            { id: 25, type: "mc", isRtl: true, text: "الْجَوَابُ عَنْ عِبَارَةِ \"السَّلَامُ عَلَيْكُمْ\" هُوَ ....", options: [{id: "A", text: "أَهْلًا بك"}, {id: "B", text: "وَعَلَيْكُمُ السَّلَامُ"}, {id: "C", text: "شُكْرًا جَزِيلًا"}, {id: "D", text: "مَعَ السَّلَامَةِ"}], answer: "B" },
            { 
                id: 26, 
                type: "matching", 
                isRtl: false, 
                text: "BAGIAN B: MENJODOHKAN\nJodohkanlah kosakata atau istilah pada Kolom A (Premis) dengan jawaban yang paling sesuai pada Kolom B (Pilihan)!",
                premises: [
                    { id: "p26", text: "طبيب (Thabiibun)", isRtl: true, answer: "G" },
                    { id: "p27", text: "تَاجِرَةٌ (Taajiratun)", isRtl: true, answer: "B" },
                    { id: "p28", text: "مِنْ أَيْنَ (Min Ayna)", isRtl: true, answer: "C" },
                    { id: "p29", text: "مُدَرِّسٌ (Mudarrisun)", isRtl: true, answer: "D" },
                    { id: "p30", text: "هَذَا (Haadzaa)", isRtl: true, answer: "E" },
                    { id: "p31", text: "شُكْرًا (Syukran)", isRtl: true, answer: "F" },
                    { id: "p32", text: "التنوين (Tanwin)", isRtl: true, answer: "A" },
                    { id: "p33", text: "صَبَاحَ الْخَيْرِ (Shabaahal Khair)", isRtl: true, answer: "H" },
                    { id: "p34", text: "خَادِمَةٌ (Khaadimatun)", isRtl: true, answer: "I" },
                    { id: "p35", text: "طَالِبٌ (Thaalibun)", isRtl: true, answer: "J" }
                ],
                options: [
                    { id: "A", text: "Tanda baca rangkap pada akhir kata Isim" },
                    { id: "B", text: "اِمْرَأَةٌ تَبِيعُ الْبَضَائِعَ (Pedagang Perempuan)", isRtl: true },
                    { id: "C", text: "Kata tanya untuk menanyakan asal tempat (Dari mana)" },
                    { id: "D", text: "أَسْتَادٌ يُعَلِّمُ الطَّلَّابَ (Guru Laki-laki)", isRtl: true },
                    { id: "E", text: "Kata tunjuk dekat untuk laki-laki (Ini)" },
                    { id: "F", text: "عِبَارَةٌ لِلشُكْرِ (Ungkapan Terima Kasih)", isRtl: true },
                    { id: "G", text: "Dokter laki-laki (Orang yang mengobati pasien)" },
                    { id: "H", text: "تَحِيَّةُ الصَّبَاحِ (Sapaan Selamat Pagi)", isRtl: true },
                    { id: "I", text: "Pembantu / Pelayan perempuan" },
                    { id: "J", text: "تِلْمِيذُ فِي الْمَدْرَسَةِ (Siswa / Murid Laki-laki)", isRtl: true }
                ]
            }
        ];

        // === FUNGSI UTILITAS ===
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        // === KOMPONEN UTAMA ===
        const App = () => {
            const [screen, setScreen] = useState('login');
            const [student, setStudent] = useState({ nama: '', kelas: '', tanggal: new Date().toISOString().split('T')[0] });
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(EXAM_DURATION);
            const [violations, setViolations] = useState(0);
            const [activeIdx, setActiveIdx] = useState(0);
            
            // Modal States
            const [alertModal, setAlertModal] = useState({ show: false, message: '', isCritical: false });
            const [confirmModal, setConfirmModal] = useState(false);
            const [finalResult, setFinalResult] = useState(null);
            
            const isSubmitting = useRef(false);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.screen === 'exam') {
                            setScreen('resume');
                        }
                    } catch(e) {}
                }
            }, []);

            useEffect(() => {
                if (screen === 'exam') {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        screen: 'exam', student, questions, answers, timeLeft, violations
                    }));
                }
            }, [screen, student, questions, answers, timeLeft, violations]);

            useEffect(() => {
                if (screen !== 'exam' || isSubmitting.current) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleAutoSubmit('Waktu Ujian Telah Habis.');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [screen]);

            useEffect(() => {
                if (screen !== 'exam') return;

                const handleVisibility = () => {
                    if (document.hidden && !isSubmitting.current) {
                        triggerViolation('Pindah Tab atau Aplikasi lain terdeteksi!');
                    }
                };

                const handleFullscreen = () => {
                    if (!document.fullscreenElement && !isSubmitting.current) {
                        triggerViolation('Keluar dari mode Fullscreen terdeteksi!');
                    }
                };

                const blockKeys = (e) => {
                    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v')) {
                        e.preventDefault();
                    }
                };
                
                const blockRightClick = (e) => {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                    }
                };

                document.addEventListener('visibilitychange', handleVisibility);
                document.addEventListener('fullscreenchange', handleFullscreen);
                document.addEventListener('keydown', blockKeys);
                document.addEventListener('contextmenu', blockRightClick);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibility);
                    document.removeEventListener('fullscreenchange', handleFullscreen);
                    document.removeEventListener('keydown', blockKeys);
                    document.removeEventListener('contextmenu', blockRightClick);
                };
            }, [screen, violations]);

            const triggerViolation = (msg) => {
                setViolations(prev => {
                    const next = prev + 1;
                    if (next >= 2) {
                        handleAutoSubmit('Diskualifikasi: Pelanggaran Sistem Terdeteksi Lebih Dari 1 Kali.');
                    } else {
                        setAlertModal({ show: true, message: `PELANGGARAN 1\n\n${msg}\nJika diulangi, ujian akan dihentikan paksa!`, isCritical: true });
                    }
                    return next;
                });
            };

            const reqFullscreen = () => {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
            };

            const startExam = (isResume = false) => {
                if (!isResume) {
                    let prepared = shuffleArray(rawQuestionsData).map(q => {
                        if (q.type === 'mc' && q.options) return { ...q, options: shuffleArray(q.options) };
                        if (q.type === 'matching') return { ...q, options: shuffleArray(q.options) };
                        return q;
                    });
                    setQuestions(prepared);
                    setAnswers({});
                    setTimeLeft(EXAM_DURATION);
                    setViolations(0);
                } else {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                    setStudent(saved.student);
                    setQuestions(saved.questions);
                    setAnswers(saved.answers);
                    setTimeLeft(saved.timeLeft);
                    setViolations(saved.violations);
                }
                setScreen('exam');
                reqFullscreen();
            };

            const calculateScore = () => {
                let totalItems = 0;
                let correctItems = 0;
                let rincian = [];
                let essayRes = [];

                questions.forEach((q) => {
                    if (q.type === 'mc') {
                        totalItems += 1;
                        const ans = answers[q.id];
                        if (!ans) {
                            rincian.push(`Soal ${q.id}: KOSONG`);
                        } else if (ans === q.answer) {
                            correctItems += 1;
                            rincian.push(`Soal ${q.id}: BENAR`);
                        } else {
                            rincian.push(`Soal ${q.id}: SALAH (Jawab: ${ans}, Kunci: ${q.answer})`);
                        }
                    } else if (q.type === 'matching') {
                        let matchingDetails = [];
                        q.premises.forEach(p => {
                            totalItems += 1;
                            const ans = answers[q.id]?.[p.id];
                            if (ans === p.answer) {
                                correctItems += 1;
                                matchingDetails.push(`${p.id}=${ans} (BENAR)`);
                            } else {
                                matchingDetails.push(`${p.id}=${ans||'KOSONG'} (SALAH, Kunci: ${p.answer})`);
                            }
                        });
                        rincian.push(`Soal ${q.id} (Menjodohkan): [${matchingDetails.join(' | ')}]`);
                    }
                });

                const finalScore = totalItems > 0 ? Math.round((correctItems / totalItems) * 100) : 0;
                return { finalScore, rincian: rincian.join(' || '), essayString: essayRes.join(' || ') };
            };

            const processSubmit = async (reason = 'Selesai Normal') => {
                isSubmitting.current = true;
                const { finalScore, rincian, essayString } = calculateScore();
                
                const payload = {
                    Nama: student.nama,
                    Kelas: student.kelas,
                    Tanggal: student.tanggal,
                    Skor: finalScore,
                    Pelanggaran: violations,
                    Keterangan: reason,
                    JawabanEsai: essayString,
                    RincianJawaban: rincian
                };

                setScreen('finished');
                setFinalResult({ ...payload, loading: true });
                localStorage.removeItem(STORAGE_KEY);
                if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});

                try {
                    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    setFinalResult(prev => ({ ...prev, loading: false, success: true }));
                } catch (err) {
                    setFinalResult(prev => ({ ...prev, loading: false, success: false }));
                }
            };

            const handleAutoSubmit = (reason) => {
                setAlertModal({ show: false });
                setConfirmModal(false);
                processSubmit(reason);
            };

            // RENDER LOGIK
            if (screen === 'login') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-lg">
                            <h1 className="text-3xl font-bold text-center text-cyan-700 mb-2">BAHASA ARAB</h1>
                            <p className="text-center text-gray-500 mb-8 text-md font-medium">SUMATIF AKHIR JENJANG (SAJ) 2026/2027 • KELAS VII</p>
                            <form onSubmit={(e) => { e.preventDefault(); startExam(false); }} className="space-y-5">
                                <div>
                                    <label className="block text-lg font-semibold mb-2">Nama Lengkap</label>
                                    <input required type="text" className="w-full border-2 p-3 text-lg rounded-lg focus:ring-4 focus:ring-cyan-500 outline-none" value={student.nama} onChange={e => setStudent({...student, nama: e.target.value})} placeholder="Masukkan nama..." />
                                </div>
                                <div>
                                    <label className="block text-lg font-semibold mb-2">Kelas</label>
                                    <input required type="text" className="w-full border-2 p-3 text-lg rounded-lg focus:ring-4 focus:ring-cyan-500 outline-none" value={student.kelas} onChange={e => setStudent({...student, kelas: e.target.value})} placeholder="Contoh: VII-A" />
                                </div>
                                <div>
                                    <label className="block text-lg font-semibold mb-2">Tanggal Ujian</label>
                                    <input required type="date" className="w-full border-2 p-3 text-lg rounded-lg focus:ring-4 focus:ring-cyan-500 outline-none" value={student.tanggal} onChange={e => setStudent({...student, tanggal: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-xl py-4 rounded-xl mt-6 transition-all shadow-lg">MULAI UJIAN</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (screen === 'resume') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-lg text-center">
                            <IconAlert />
                            <h2 className="text-2xl font-bold mb-4">Sesi Ujian Tersimpan!</h2>
                            <p className="text-gray-600 mb-8 text-lg">Sistem mendeteksi Anda belum menyelesaikan ujian sebelumnya.</p>
                            <div className="space-y-4">
                                <button onClick={() => startExam(true)} className="w-full bg-green-600 hover:bg-green-700 text-white text-xl font-bold py-3 rounded-lg shadow-md">LANJUTKAN UJIAN</button>
                                <button onClick={() => { localStorage.removeItem(STORAGE_KEY); setScreen('login'); }} className="w-full bg-red-100 hover:bg-red-200 text-red-700 text-lg font-bold py-3 rounded-lg">HAPUS & MULAI ULANG</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'finished') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-10 w-full max-w-lg text-center">
                            {finalResult?.loading ? (
                                <div>
                                    <div className="animate-spin rounded-full h-20 w-20 border-b-4 border-cyan-600 mx-auto mb-6"></div>
                                    <h2 className="text-2xl font-bold text-gray-700">Mengirim Data...</h2>
                                </div>
                            ) : (
                                <div>
                                    <IconCheck />
                                    <h2 className="text-3xl font-bold text-green-600 mb-3">Ujian Selesai!</h2>
                                    <p className="text-gray-600 text-lg mb-6">{finalResult.Keterangan}</p>
                                    <div className="bg-gray-100 p-6 rounded-xl text-left text-lg space-y-3 mb-8">
                                        <p><strong>Nama:</strong> {finalResult.Nama}</p>
                                        <p><strong>Kelas:</strong> {finalResult.Kelas}</p>
                                        <p><strong>Skor Akhir:</strong> <span className="text-3xl font-extrabold text-cyan-700 align-middle ml-2">{finalResult.Skor}</span></p>
                                    </div>
                                    {finalResult.success ? (
                                        <p className="text-green-700 font-bold text-lg bg-green-100 py-2 rounded-lg">Data berhasil tersimpan di server.</p>
                                    ) : (
                                        <p className="text-red-600 font-bold text-lg bg-red-100 py-2 rounded-lg">Data telah tercatat di sistem lokal.</p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // === EXAM UI ===
            const q = questions[activeIdx];
            const hasImagesInOptions = q.type === 'mc' && q.options.some(opt => opt.image);
            
            const getQuestionStatus = (idx) => {
                const quest = questions[idx];
                const ans = answers[quest.id];
                if (quest.type === 'mc' || quest.type === 'essay') return ans ? 'bg-green-500 text-white' : 'bg-white text-gray-700 border-gray-300';
                if (quest.type === 'matching') {
                    const isAllFilled = quest.premises.every(p => ans && ans[p.id]);
                    return isAllFilled ? 'bg-green-500 text-white' : 'bg-white text-gray-700 border-gray-300';
                }
                return 'bg-white';
            };

            return (
                <div className="flex flex-col h-screen exam-active bg-gray-50">
                    {/* Header */}
                    <header className="bg-cyan-800 text-white p-5 shadow-md flex justify-between items-center shrink-0">
                        <div>
                            <h1 className="text-2xl font-bold tracking-wider">BAHASA ARAB</h1>
                            <p className="text-sm font-medium text-cyan-200">SAJ 2026/2027 • Kelas VII</p>
                        </div>
                        <div className="flex items-center space-x-6">
                            <div className="hidden md:flex items-center text-lg bg-cyan-900 px-4 py-2 rounded-lg shadow-inner">
                                <IconUser /> <span className="font-semibold">{student.nama}</span>
                            </div>
                            <div className={`font-mono text-2xl font-bold px-5 py-2 rounded-lg shadow-inner flex items-center ${timeLeft < 300 ? 'bg-red-600 animate-pulse' : 'bg-cyan-900'}`}>
                                <IconClock /> {formatTime(timeLeft)}
                            </div>
                        </div>
                    </header>

                    {/* Main Layout */}
                    <div className="flex flex-1 overflow-hidden flex-col md:flex-row">
                        {/* Area Soal */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-28">
                            <div className="bg-white rounded-2xl shadow-lg p-6 md:p-10 max-w-5xl mx-auto border border-gray-100">
                                <div className="mb-6 text-lg font-extrabold text-cyan-700 border-b-2 border-cyan-100 pb-3 uppercase tracking-wide">Soal No. {activeIdx + 1}</div>
                                
                                {/* Teks Soal Spesial Multi-part (Contoh untuk Soal No. 16) */}
                                {q.textTop && <div className="mb-4 text-xl font-medium whitespace-pre-wrap">{q.textTop}</div>}
                                {q.textArabic && <div className="mb-6 text-3xl md:text-4xl arabic-text text-right text-gray-900 bg-cyan-50 p-6 rounded-xl border border-cyan-100 whitespace-pre-wrap" dir="rtl">{q.textArabic}</div>}
                                {q.textBottom && <div className="mb-8 text-xl font-medium whitespace-pre-wrap">{q.textBottom}</div>}

                                {/* Teks Soal Standar */}
                                {q.text && (
                                    <div className={`mb-8 font-medium whitespace-pre-wrap ${q.isRtl ? 'arabic-text text-right text-3xl md:text-4xl text-gray-900' : 'text-left text-xl'}`} dir={q.isRtl ? 'rtl' : 'ltr'}>
                                        {q.text}
                                    </div>
                                )}

                                {/* Gambar Soal */}
                                {q.image && (
                                    <div className="mb-8 flex justify-center bg-gray-50 p-4 rounded-xl border">
                                        <img src={q.image} alt="Ilustrasi Soal" className="max-w-full h-auto rounded-lg shadow-sm max-h-80 object-contain" />
                                    </div>
                                )}

                                {/* Tipe: Pilihan Ganda */}
                                {q.type === 'mc' && (
                                    <div className={hasImagesInOptions ? "grid grid-cols-1 md:grid-cols-2 gap-6" : "space-y-4"}>
                                        {q.options.map((opt) => {
                                            const isSelected = answers[q.id] === opt.id;
                                            return (
                                                <label key={opt.id} className={`flex ${hasImagesInOptions ? 'flex-col' : 'items-center'} p-5 border-2 rounded-xl cursor-pointer transition-all duration-200 ${isSelected ? 'border-cyan-500 bg-cyan-50 shadow-md ring-1 ring-cyan-500' : 'border-gray-200 hover:border-cyan-400 hover:bg-gray-50'}`}>
                                                    
                                                    {/* Gambar Opsi (Jika ada) */}
                                                    {hasImagesInOptions && opt.image && (
                                                        <div className="w-full flex justify-center mb-4 bg-white p-2 rounded-lg border">
                                                            <img src={opt.image} alt="Opsi" className="rounded-lg max-h-48 object-contain" />
                                                        </div>
                                                    )}

                                                    <div className={`flex items-center w-full`}>
                                                        <input type="radio" name={`q_${q.id}`} value={opt.id} checked={isSelected} onChange={() => setAnswers({...answers, [q.id]: opt.id})} className="w-6 h-6 text-cyan-600 focus:ring-cyan-500 shrink-0" />
                                                        <div className={`ml-4 flex-1 ${opt.isRtl ? 'arabic-text text-right text-2xl md:text-3xl font-bold' : 'text-xl font-medium'}`} dir={opt.isRtl ? 'rtl' : 'ltr'}>
                                                            {opt.text}
                                                        </div>
                                                    </div>
                                                </label>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Tipe: Menjodohkan */}
                                {q.type === 'matching' && (
                                    <div className="space-y-6">
                                        <div className="bg-blue-50 border border-blue-200 p-5 rounded-xl mb-8 text-lg text-blue-900 shadow-sm">
                                            <strong>Panduan:</strong> Pilih pasangan jawaban yang tepat untuk setiap premis di bawah ini melalui menu dropdown.
                                        </div>
                                        <div className="grid grid-cols-1 gap-5">
                                            {q.premises.map((p, idx) => (
                                                <div key={p.id} className="flex flex-col lg:flex-row lg:items-center justify-between p-5 border-2 rounded-xl bg-gray-50 hover:bg-white transition-colors">
                                                    <div className={`flex-1 mb-4 lg:mb-0 ${p.isRtl ? 'arabic-text text-right text-3xl font-bold' : 'text-xl'}`} dir={p.isRtl ? 'rtl' : 'ltr'}>
                                                        <span className="font-black mr-3 text-lg text-gray-400">{idx+1}.</span>{p.text}
                                                    </div>
                                                    <div className="w-full lg:w-1/2 lg:ml-6">
                                                        <select 
                                                            className={`w-full p-4 text-lg border-2 rounded-xl outline-none focus:ring-4 focus:ring-cyan-500 font-medium cursor-pointer transition-colors ${answers[q.id]?.[p.id] ? 'bg-cyan-50 border-cyan-400 text-cyan-900' : 'bg-white border-gray-300'}`}
                                                            value={answers[q.id]?.[p.id] || ''}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                setAnswers(prev => ({
                                                                    ...prev,
                                                                    [q.id]: { ...(prev[q.id] || {}), [p.id]: val }
                                                                }));
                                                            }}
                                                        >
                                                            <option value="" disabled>-- Pilih Pasangan Jawaban --</option>
                                                            {q.options.map(opt => (
                                                                <option key={opt.id} value={opt.id} className="text-lg">
                                                                    [{opt.id}] {opt.text}
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Navigasi Soal (Kanan) */}
                        <div className="w-full md:w-80 bg-white border-l shadow-2xl flex flex-col shrink-0 z-10">
                            <div className="p-5 bg-gray-100 font-extrabold text-lg border-b text-center text-gray-700 uppercase tracking-widest">Navigasi Soal</div>
                            <div className="p-5 flex-1 overflow-y-auto">
                                <div className="grid grid-cols-5 gap-3">
                                    {questions.map((quest, idx) => {
                                        const statusClass = getQuestionStatus(idx);
                                        const isActive = idx === activeIdx;
                                        return (
                                            <button 
                                                key={quest.id} 
                                                onClick={() => setActiveIdx(idx)}
                                                className={`h-12 text-lg rounded-lg border-2 font-bold flex items-center justify-center transition-all ${statusClass} ${isActive ? 'ring-4 ring-cyan-300 border-cyan-700 scale-110 shadow-md' : 'hover:bg-gray-100 border-gray-200'}`}
                                            >
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer Navigasi Bawah */}
                    <div className="bg-white border-t p-5 flex justify-between items-center shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] shrink-0 z-20 absolute bottom-0 left-0 right-0 md:right-80">
                        <button onClick={() => setActiveIdx(Math.max(0, activeIdx - 1))} disabled={activeIdx === 0} className="px-8 py-3 text-lg bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-xl font-bold disabled:opacity-40 transition-colors">Sebelumnnya</button>
                        
                        {activeIdx === questions.length - 1 ? (
                            <button onClick={() => setConfirmModal(true)} className="px-8 py-3 text-lg bg-green-600 hover:bg-green-700 text-white rounded-xl font-extrabold shadow-lg transition-transform transform hover:scale-105">Selesai & Kumpulkan</button>
                        ) : (
                            <button onClick={() => setActiveIdx(Math.min(questions.length - 1, activeIdx + 1))} className="px-8 py-3 text-lg bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-bold shadow-md transition-colors">Selanjutnya</button>
                        )}
                    </div>

                    {/* MODAL SYSTEM */}
                    
                    {/* Alert Modal */}
                    {alertModal.show && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center bg-black/70 backdrop-blur-md">
                            <div className="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
                                <IconAlert />
                                <h3 className="text-2xl font-black text-red-600 mb-3">PERINGATAN!</h3>
                                <p className="text-gray-800 text-lg mb-8 font-medium whitespace-pre-wrap">{alertModal.message}</p>
                                <button onClick={() => {
                                    setAlertModal({ show: false });
                                    reqFullscreen(); 
                                }} className="w-full bg-red-600 hover:bg-red-700 text-white text-xl font-bold py-4 rounded-xl shadow-lg transition-colors">Saya Mengerti</button>
                            </div>
                        </div>
                    )}

                    {/* Confirm Submit Modal */}
                    {confirmModal && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center bg-black/70 backdrop-blur-md">
                            <div className="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
                                <h3 className="text-2xl font-black text-gray-900 mb-3">Konfirmasi Pengumpulan</h3>
                                <p className="text-gray-600 text-lg font-medium mb-8">Apakah Anda yakin ingin menyelesaikan dan mengumpulkan ujian ini? Anda tidak bisa kembali setelah ini.</p>
                                <div className="flex space-x-4">
                                    <button onClick={() => setConfirmModal(false)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-900 text-lg font-bold py-3 rounded-xl transition-colors">Batal</button>
                                    <button onClick={() => processSubmit('Selesai Mandiri')} className="flex-1 bg-green-600 hover:bg-green-700 text-white text-lg font-bold py-3 rounded-xl shadow-lg transition-colors">Ya, Kumpulkan</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
