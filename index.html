        // ==========================================

        // ==========================================
        // HELPERS
        // ==========================================
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function App() {
            const [screen, setScreen] = React.useState('login'); // 'login', 'resume', 'exam', 'finished'
            const [user, setUser] = React.useState({ nama: '', kelas: '', tanggal: new Date().toISOString().split('T')[0] });
            const [questions, setQuestions] = React.useState([]);
            const [answers, setAnswers] = React.useState({});
            const [currentIdx, setCurrentIdx] = React.useState(0);
            const [timeLeft, setTimeLeft] = React.useState(DURASI_MENIT * 60);
            const [cheats, setCheats] = React.useState(0);
            const [modal, setModal] = React.useState(null); // { type: 'warning'|'confirm'|'loading', message: '' }
            const [finalResult, setFinalResult] = React.useState(null);

            // Cek LocalStorage saat pertama dimuat
            React.useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (!parsed.isSubmitted) {
                            setScreen('resume');
                        }
                    } catch (e) {
                        localStorage.removeItem(STORAGE_KEY);
                    }
                }
            }, []);

            // Auto-Save Effect
            React.useEffect(() => {
                if (screen === 'exam') {
                    const dataToSave = { user, questions, answers, timeLeft, cheats, isSubmitted: false };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
                }
            }, [answers, timeLeft, cheats, screen]);

            // Timer & Anti-Cheat Effect
            React.useEffect(() => {
                let timer;
                if (screen === 'exam') {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleAutoSubmit("Waktu Habis");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);

                    const handleVisibility = () => {
                        if (document.hidden) recordCheat();
                    };
                    const handleFullscreen = () => {
                        if (!document.fullscreenElement) recordCheat();
                    };
                    const handleContextMenu = (e) => e.preventDefault();
                    const handleCopy = (e) => {
                        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
                    };

                    document.addEventListener('visibilitychange', handleVisibility);
                    document.addEventListener('fullscreenchange', handleFullscreen);
                    document.addEventListener('contextmenu', handleContextMenu);
                    document.addEventListener('copy', handleCopy);

                    return () => {
                        clearInterval(timer);
                        document.removeEventListener('visibilitychange', handleVisibility);
                        document.removeEventListener('fullscreenchange', handleFullscreen);
                        document.removeEventListener('contextmenu', handleContextMenu);
                        document.removeEventListener('copy', handleCopy);
                    };
                }
            }, [screen, cheats]);

            const recordCheat = () => {
                setCheats(prev => {
                    const newCount = prev + 1;
                    if (newCount === 1) {
                        setModal({ type: 'warning', message: 'PERINGATAN! Anda terdeteksi keluar dari layar ujian atau berpindah tab. Jika diulangi 1 kali lagi, ujian akan dihentikan otomatis.' });
                    } else if (newCount >= 2) {
                        handleAutoSubmit("Pelanggaran Sistem (Keluar Layar)");
                    }
                    return newCount;
                });
            };

            const enterFullscreen = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            };

            const startExam = (isResume = false) => {
                if (!isResume) {
                    // Acak Soal dan Opsi
                    const shuffled = shuffleArray(rawQuestionsData).map(q => {
                        let newQ = { ...q };
                        if (q.type === 'mc') newQ.options = shuffleArray(q.options);
                        if (q.type === 'matching') {
                            newQ.premises = shuffleArray(q.premises);
                            newQ.options = shuffleArray(q.options); // Urutan dropdown diacak
                        }
                        return newQ;
                    });
                    setQuestions(shuffled);
                    setAnswers({});
                    setTimeLeft(DURASI_MENIT * 60);
                    setCheats(0);
                } else {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                    setUser(saved.user);
                    setQuestions(saved.questions);
                    setAnswers(saved.answers || {});
                    setTimeLeft(saved.timeLeft);
                    setCheats(saved.cheats || 0);
                }
                setScreen('exam');
                enterFullscreen();
            };

            const calculateScore = () => {
                let totalScore = 0;
                let rincianArr = [];
                let esaiArr = [];
                let totalBobot = 0;

                questions.forEach(q => {
                    const originalQ = rawQuestionsData.find(rq => rq.id === q.id);
                    if (q.type === 'mc') {
                        totalBobot += 1;
                        const ans = answers[q.id];
                        if (ans === originalQ.key) {
                            totalScore += 1;
                            rincianArr.push(`Soal ${q.id}: BENAR`);
                        } else if (ans) {
                            rincianArr.push(`Soal ${q.id}: SALAH (Pilih: ${ans}, Kunci: ${originalQ.key})`);
                        } else {
                            rincianArr.push(`Soal ${q.id}: KOSONG`);
                        }
                    } else if (q.type === 'matching') {
                        totalBobot += originalQ.premises.length; // 10 premis = bobot 10
                        let matchingRincian = [];
                        originalQ.premises.forEach(premise => {
                            const ans = answers[`${q.id}_${premise.id}`];
                            if (ans === premise.key) {
                                totalScore += 1;
                                matchingRincian.push(`${premise.id}=${ans} (BENAR)`);
                            } else if (ans) {
                                matchingRincian.push(`${premise.id}=${ans} (SALAH, Kunci: ${premise.key})`);
                            } else {
                                matchingRincian.push(`${premise.id}=KOSONG`);
                            }
                        });
                        rincianArr.push(`Soal ${q.id} (Menjodohkan): [${matchingRincian.join(' | ')}]`);
                    } else if (q.type === 'essay' || q.type === 'short_answer') {
                        // Tidak ada di PDF, tapi disiapkan struktur
                        const ans = answers[q.id] || 'KOSONG';
                        esaiArr.push(`Soal ${q.id}: ${ans.replace(/\n/g, ' ')}`);
                        rincianArr.push(`Soal ${q.id} (${q.type}): [Terekam di Esai]`);
                    }
                });

                const finalSkor = Math.round((totalScore / totalBobot) * 100);
                return {
                    skor: finalSkor,
                    rincian: rincianArr.join(' || '),
                    esai: esaiArr.length > 0 ? esaiArr.join(' || ') : '-'
                };
            };

            const submitData = async (keterangan) => {
                setModal({ type: 'loading', message: 'Sedang menyimpan jawaban ke server...' });
                const calc = calculateScore();
                
                const payload = {
                    waktuSubmit: new Date().toLocaleString('id-ID'),
                    nama: user.nama,
                    kelas: user.kelas,
                    tanggal: user.tanggal,
                    nilai: calc.skor,
                    jawabanEsai: calc.esai,
                    pelanggaran: cheats,
                    keterangan: keterangan,
                    rincianJawaban: calc.rincian
                };

                try {
                    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Penting untuk bypass CORS policy ke GAS
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Gagal mengirim data", e);
                }

                localStorage.removeItem(STORAGE_KEY);
                if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                setFinalResult(payload);
                setModal(null);
                setScreen('finished');
            };

            const handleAutoSubmit = (alasan) => {
                setModal(null);
                submitData(alasan);
            };

            const handleAnswer = (qId, value) => {
                setAnswers(prev => ({ ...prev, [qId]: value }));
            };

            const isQuestionAnswered = (qIndex) => {
                const q = questions[qIndex];
                if (q.type === 'mc' || q.type === 'short_answer' || q.type === 'essay') {
                    return !!answers[q.id];
                }
                if (q.type === 'matching') {
                    return q.premises.every(p => !!answers[`${q.id}_${p.id}`]);
                }
                return false;
            };

            // ==========================================
            // RENDER: MODAL
            // ==========================================
            const renderModal = () => {
                if (!modal) return null;
                return (
                    <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
                        <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md text-center transform transition-all">
                            {modal.type === 'warning' && (
                                <>
                                    <div className="flex justify-center mb-4"><IconWarning /></div>
                                    <h2 className="text-xl font-bold text-red-600 mb-2">PELANGGARAN TERDETEKSI</h2>
                                    <p className="text-gray-700 mb-6">{modal.message}</p>
                                    <button onClick={() => { setModal(null); enterFullscreen(); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">Saya Mengerti & Lanjutkan</button>
                                </>
                            )}
                            {modal.type === 'confirm' && (
                                <>
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Selesai Ujian?</h2>
                                    <p className="text-gray-600 mb-6">{modal.message}</p>
                                    <div className="flex space-x-3">
                                        <button onClick={() => setModal(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg">Batal</button>
                                        <button onClick={() => submitData("Selesai Normal")} className="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">Ya, Kumpulkan</button>
                                    </div>
                                </>
                            )}
                            {modal.type === 'loading' && (
                                <div className="py-8">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                                    <p className="text-gray-700 font-medium">{modal.message}</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ==========================================
            // RENDER: LAYAR LOGIN
            // ==========================================
            if (screen === 'login') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="bg-white/10 backdrop-blur-md rounded-2xl shadow-xl p-8 w-full max-w-md border border-white/20 text-white">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold mb-2">{MAPEL}</h1>
                                <p className="text-cyan-100 font-medium">{JENIS_UJIAN}</p>
                                <p className="text-sm mt-1 bg-white/20 inline-block px-3 py-1 rounded-full">Kelas: {KELAS} | Waktu: {DURASI_MENIT} Menit</p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); startExam(false); }} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-1">Nama Lengkap</label>
                                    <input required type="text" value={user.nama} onChange={e => setUser({...user, nama: e.target.value})} className="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-2.5 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white" placeholder="Masukkan nama..." />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Kelas</label>
                                    <input required type="text" value={user.kelas} onChange={e => setUser({...user, kelas: e.target.value})} className="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-2.5 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white" placeholder="Contoh: VII-A" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Tanggal Ujian</label>
                                    <input required type="date" value={user.tanggal} onChange={e => setUser({...user, tanggal: e.target.value})} className="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-white" />
                                </div>
                                <button type="submit" className="w-full bg-cyan-500 hover:bg-cyan-400 text-white font-bold text-lg py-3 rounded-lg shadow-lg transform transition active:scale-95 mt-6">
                                    MULAI UJIAN
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // RENDER: LAYAR RESUME
            // ==========================================
            if (screen === 'resume') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
                            <div className="text-yellow-500 flex justify-center mb-4"><IconWarning /></div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Sesi Tersimpan Ditemukan!</h2>
                            <p className="text-gray-600 mb-8">Sistem mendeteksi Anda belum menyelesaikan ujian sebelumnya. Apakah Anda ingin melanjutkan?</p>
                            <div className="space-y-3">
                                <button onClick={() => startExam(true)} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">Lanjutkan Ujian (Pulihkan)</button>
                                <button onClick={() => { localStorage.removeItem(STORAGE_KEY); setScreen('login'); }} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-lg">Mulai Ulang (Hapus Progres)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // RENDER: LAYAR SELESAI
            // ==========================================
            if (screen === 'finished') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
                            <div className="flex justify-center mb-4"><IconCheck /></div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">Terima kasih, jawaban Anda telah berhasil dikirim ke server.</p>
                            <div className="bg-gray-50 rounded-lg p-4 text-left border border-gray-100 mb-6">
                                <p><strong>Nama:</strong> {finalResult?.nama}</p>
                                <p><strong>Kelas:</strong> {finalResult?.kelas}</p>
                                <p><strong>Skor Akhir:</strong> <span className="text-xl font-bold text-blue-600">{finalResult?.nilai}</span> / 100</p>
                                <p className="text-xs text-gray-400 mt-2">Ket: {finalResult?.keterangan}</p>
                            </div>
                            <button onClick={() => window.location.reload()} className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded-lg">Kembali ke Awal</button>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // RENDER: LAYAR UJIAN UTAMA
            // ==========================================
            const q = questions[currentIdx];
            if (!q) return null;

            return (
                <div className="min-h-screen flex flex-col bg-gray-50 exam-active">
                    {renderModal()}
                    
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div>
                                <h1 className="font-bold text-lg text-gray-800">{MAPEL}</h1>
                                <p className="text-xs text-gray-500">{JENIS_UJIAN} - Kelas {KELAS}</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="hidden sm:flex items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-full text-sm font-medium">
                                    <IconUser /> {user.nama}
                                </div>
                                <div className={`flex items-center gap-2 px-4 py-1.5 rounded-full font-bold text-lg shadow-sm ${timeLeft < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-blue-100 text-blue-700'}`}>
                                    <IconClock /> {formatTime(timeLeft)}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl mx-auto w-full flex flex-col lg:flex-row gap-6 p-4">
                        
                        {/* Area Soal */}
                        <div className="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col">
                            <div className="p-6 border-b border-gray-100 flex-1 overflow-y-auto">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Soal No. {currentIdx + 1}</h2>
                                
                                {q.image && (
                                    <img src={q.image} alt="Soal" className="max-w-full h-auto rounded-lg mb-6 border border-gray-200 shadow-sm" />
                                )}

                                <div className="text-lg text-gray-800 mb-8" dangerouslySetInnerHTML={{ __html: q.text }}></div>

                                {/* Opsi Jawaban (MC) */}
                                {q.type === 'mc' && (
                                    <div className="space-y-3">
                                        {q.options.map(opt => (
                                            <label key={opt.id} className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${answers[q.id] === opt.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-blue-300 bg-white'}`}>
                                                <input 
                                                    type="radio" 
                                                    name={`q_${q.id}`} 
                                                    className="w-5 h-5 text-blue-600 mr-4 focus:ring-0" 
                                                    checked={answers[q.id] === opt.id}
                                                    onChange={() => handleAnswer(q.id, opt.id)}
                                                />
                                                <span className="text-gray-700 flex-1" dangerouslySetInnerHTML={{ __html: opt.text }}></span>
                                            </label>
                                        ))}
                                    </div>
                                )}

                                {/* Jawaban (Menjodohkan) */}
                                {q.type === 'matching' && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-100 p-4 rounded-lg font-semibold text-gray-600 text-center mb-4 hidden md:grid">
                                            <div>Daftar Pernyataan / Premis</div>
                                            <div>Pilih Pasangan yang Tepat</div>
                                        </div>
                                        {q.premises.map((premise, pIdx) => (
                                            <div key={premise.id} className="flex flex-col md:flex-row gap-4 items-center bg-white p-4 border border-gray-200 rounded-lg shadow-sm">
                                                <div className="flex-1 w-full flex items-center">
                                                    <span className="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-md mr-3">{pIdx + 1}</span>
                                                    <span dangerouslySetInnerHTML={{ __html: premise.text }}></span>
                                                </div>
                                                <div className="w-full md:w-1/2">
                                                    <select 
                                                        className="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                                        value={answers[`${q.id}_${premise.id}`] || ''}
                                                        onChange={(e) => handleAnswer(`${q.id}_${premise.id}`, e.target.value)}
                                                    >
                                                        <option value="" disabled>-- Pilih Pasangan --</option>
                                                        {q.options.map(opt => (
                                                            <option key={opt.id} value={opt.id}>{opt.text.replace(/<[^>]*>?/gm, '')}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Navigasi Bawah */}
                            <div className="bg-gray-50 p-4 rounded-b-xl border-t border-gray-200 flex justify-between items-center">
                                <button 
                                    onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                                    disabled={currentIdx === 0}
                                    className="px-6 py-2.5 bg-white border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-100 disabled:opacity-50"
                                >
                                    Sebelumnya
                                </button>
                                
                                {currentIdx === questions.length - 1 ? (
                                    <button onClick={() => {
                                        const unans = questions.filter((_, i) => !isQuestionAnswered(i)).length;
                                        setModal({
                                            type: 'confirm',
                                            message: unans > 0 ? `Terdapat ${unans} soal yang belum dijawab/diselesaikan. Yakin ingin mengumpulkan ujian sekarang?` : `Anda sudah menjawab seluruh soal. Yakin ingin mengumpulkan ujian sekarang?`
                                        });
                                    }} className="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md">
                                        Selesai & Kumpulkan
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setCurrentIdx(prev => Math.min(questions.length - 1, prev + 1))}
                                        className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-md"
                                    >
                                        Selanjutnya
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Panel Navigasi Kotak Nomor */}
                        <div className="w-full lg:w-72 bg-white rounded-xl shadow-sm border border-gray-100 p-4 h-fit">
                            <h3 className="font-bold text-gray-800 mb-4 pb-2 border-b">Navigasi Soal</h3>
                            <div className="grid grid-cols-5 gap-2">
                                {questions.map((_, i) => {
                                    const answered = isQuestionAnswered(i);
                                    const active = currentIdx === i;
                                    return (
                                        <button
                                            key={i}
                                            onClick={() => setCurrentIdx(i)}
                                            className={`
                                                aspect-square rounded-lg font-bold text-sm flex items-center justify-center transition
                                                ${answered ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600 border border-gray-200'}
                                                ${active ? 'ring-4 ring-blue-300/50 scale-105 shadow-md' : 'hover:bg-gray-200'}
                                            `}
                                        >
                                            {i + 1}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="mt-6 space-y-2 text-xs text-gray-500">
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-green-500 rounded"></div> Sudah Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-100 border border-gray-200 rounded"></div> Belum Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-4 h-4 ring-4 ring-blue-300/50 bg-gray-100 rounded"></div> Sedang Dibuka</div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
