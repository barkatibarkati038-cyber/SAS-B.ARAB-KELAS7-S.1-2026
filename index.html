            // --- TAMBAHAN UNTUK DEMO TIPE SOAL LAIN (ESAI, ISIAN SINGKAT, KOMPLEKS) ---
            { id: 27, type: "essay", question: `Jelaskan mengapa penting bagi seorang pelajar Muslim untuk mempelajari Bahasa Arab? (Berikan minimal 2 alasan logis).` },
            { id: 28, type: "short_answer", question: `Tuliskan transliterasi Latin yang benar dari kata benda "<span dir="rtl" class="font-arabic text-xl">مَدْرَسَةٌ</span>" !`, answer: "Madrasatun" },
            { id: 29, type: "complex", question: `Manakah dari profesi berikut yang UMUMNYA dapat ditemukan bekerja di dalam lingkungan SEBUAH SEKOLAH? (Centang semua jawaban yang benar)`, options: ["Guru (مُدَرِّسٌ)", "Siswa (طَالِبٌ)", "Pilot (طَيَّارٌ)", "Satpam (بَوَّابٌ)"], answers: ["Guru (مُدَرِّسٌ)", "Siswa (طَالِبٌ)", "Satpam (بَوَّابٌ)"] }
        ];

        // ==========================================
        // UTILITAS & ALGORITMA SHUFFLE (FISHER-YATES)
        // ==========================================
        const mulberry32 = (a) => {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        
        const shuffleArray = (array, rng) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        // ==========================================
        // KOMPONEN IKON (INLINE SVG)
        // ==========================================
        const IconCheck = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>;
        const IconAlert = () => <svg className="w-12 h-12 text-yellow-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        const IconTime = () => <svg className="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconSave = () => <svg className="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>;

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [view, setView] = useState("login"); // login, exam, result
            const [session, setSession] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            
            // Modal States
            const [modal, setModal] = useState({ show: false, type: "", message: "", onConfirm: null });

            // Initialize app check for existing session
            useEffect(() => {
                const saved = localStorage.getItem(CONFIG.storageKey);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.status === "in_progress") {
                            setModal({
                                show: true,
                                type: "resume",
                                message: "Sesi ujian Anda sebelumnya ditemukan. Apakah Anda ingin melanjutkan?",
                                onConfirm: () => {
                                    setSession(parsed);
                                    setQuestions(parsed.questionsData);
                                    setView("exam");
                                    setModal({ show: false });
                                }
                            });
                        }
                    } catch (e) {
                        localStorage.removeItem(CONFIG.storageKey);
                    }
                }
            }, []);

            // Auto-Save Effect
            useEffect(() => {
                if (view === "exam" && session) {
                    const saveSession = { ...session, questionsData: questions };
                    localStorage.setItem(CONFIG.storageKey, JSON.stringify(saveSession));
                }
            }, [session, questions, view]);

            // ==========================================
            // TIMER & ANTI-CHEAT LOGIC
            // ==========================================
            useEffect(() => {
                if (view !== "exam" || !session) return;
                
                const timerId = setInterval(() => {
                    setSession(prev => {
                        if (prev.timeRemaining <= 1) {
                            clearInterval(timerId);
                            forceSubmit(prev, questions, "Waktu Habis");
                            return prev;
                        }
                        return { ...prev, timeRemaining: prev.timeRemaining - 1 };
                    });
                }, 1000);

                // Anti-Cheat Listeners
                const handleVisibilityChange = () => {
                    if (document.hidden) handleCheatViolation();
                };
                
                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement) handleCheatViolation("Keluar dari Mode Fullscreen!");
                };

                document.addEventListener("visibilitychange", handleVisibilityChange);
                document.addEventListener("fullscreenchange", handleFullscreenChange);

                return () => {
                    clearInterval(timerId);
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                    document.removeEventListener("fullscreenchange", handleFullscreenChange);
                };
            }, [view]); // Dependencies left minimal to prevent re-binding loops

            const handleCheatViolation = (reason = "Membuka tab/aplikasi lain!") => {
                setSession(prev => {
                    const newCount = prev.cheatCount + 1;
                    if (newCount === 1) {
                        setModal({
                            show: true, type: "warning",
                            message: `PELANGGARAN TERDETEKSI: ${reason}\nIni adalah peringatan pertama. Jika diulangi, ujian otomatis dikumpulkan!`,
                            onConfirm: () => {
                                setModal({ show: false });
                                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                            }
                        });
                    } else if (newCount >= 2) {
                        forceSubmit(prev, questions, `Dihentikan Otomatis (Pelanggaran: ${reason})`);
                    }
                    return { ...prev, cheatCount: newCount };
                });
            };

            const forceSubmit = (finalSession, finalQuestions, reason) => {
                setModal({ show: false }); // Hide any open modals
                calculateAndSubmit(finalSession, finalQuestions, reason);
            };

            // ==========================================
            // START & SUBMIT LOGIC
            // ==========================================
            const startExam = (formData) => {
                // Request Fullscreen
                document.documentElement.requestFullscreen().catch(err => console.log(err));

                const rng = mulberry32(formData.seed);
                
                // Prepare & Shuffle Questions
                let preparedQuestions = rawQuestionsData.map(q => {
                    let newQ = { ...q, userAnswer: null };
                    
                    if (q.type === 'mc' || q.type === 'complex') {
                        newQ.options = shuffleArray(q.options, rng);
                        if (q.type === 'complex') newQ.userAnswer = [];
                    } else if (q.type === 'matching') {
                        // Shuffle answers for the dropdowns
                        const allAnswers = q.pairs.map(p => p.answer);
                        newQ.shuffledAnswers = shuffleArray(allAnswers, rng);
                        newQ.userAnswer = q.pairs.map(() => ""); 
                    }
                    return newQ;
                });
                
                preparedQuestions = shuffleArray(preparedQuestions, rng);

                setQuestions(preparedQuestions);
                setSession({
                    ...formData,
                    status: "in_progress",
                    timeRemaining: CONFIG.durasiMenit * 60,
                    cheatCount: 0
                });
                setCurrentQIndex(0);
                setView("exam");
            };

            const calculateAndSubmit = (currSession, currQuestions, keterangan = "Selesai Normal") => {
                setView("submitting");
                let totalScore = 0;
                let maxScore = currQuestions.length; // Base weight 1 per question
                let rincianArr = [];
                let esaiArr = [];

                currQuestions.forEach(q => {
                    let status = "KOSONG";
                    let scoreAdd = 0;

                    if (q.type === 'mc' || q.type === 'short_answer') {
                        if (q.userAnswer) {
                            if (String(q.userAnswer).trim().toLowerCase() === String(q.answer).trim().toLowerCase()) {
                                status = "BENAR";
                                scoreAdd = 1;
                            } else {
                                status = `SALAH (Pilih: ${q.userAnswer}, Kunci: ${q.answer})`;
                            }
                        }
                        rincianArr.push(`Soal ${q.id}: ${status}`);
                    } 
                    else if (q.type === 'complex') {
                        if (q.userAnswer && q.userAnswer.length > 0) {
                            // Check exact match arrays
                            const sortedUser = [...q.userAnswer].sort();
                            const sortedKey = [...q.answers].sort();
                            if (JSON.stringify(sortedUser) === JSON.stringify(sortedKey)) {
                                status = "BENAR";
                                scoreAdd = 1;
                            } else {
                                status = `SALAH (Pilih: [${sortedUser.join(',')}], Kunci: [${sortedKey.join(',')}])`;
                            }
                        }
                        rincianArr.push(`Soal ${q.id}: ${status}`);
                    }
                    else if (q.type === 'matching') {
                        let matchDetails = [];
                        let matchCorrectCount = 0;
                        q.pairs.forEach((pair, idx) => {
                            let uAns = q.userAnswer ? q.userAnswer[idx] : "";
                            if (uAns === pair.answer) {
                                matchCorrectCount++;
                                matchDetails.push(`Premis${idx+1}=${uAns} (BENAR)`);
                            } else {
                                matchDetails.push(`Premis${idx+1}=${uAns || 'KOSONG'} (SALAH, Kunci: ${pair.answer})`);
                            }
                        });
                        scoreAdd = matchCorrectCount / q.pairs.length;
                        rincianArr.push(`Soal ${q.id} (Menjodohkan): [${matchDetails.join(' | ')}]`);
                    }
                    else if (q.type === 'essay') {
                        const sanitizedUser = q.userAnswer ? String(q.userAnswer).replace(/\n/g, ' ') : "KOSONG";
                        esaiArr.push(`Soal ${q.id}: ${sanitizedUser}`);
                        rincianArr.push(`Soal ${q.id} (Esai): [${sanitizedUser}]`);
                        // Essay default score 0 until teacher grades
                    }

                    totalScore += scoreAdd;
                });

                const finalNilai = Math.round((totalScore / maxScore) * 100);
                const rincianJawaban = rincianArr.join(" || ");
                const jawabanEsai = esaiArr.join(" \n\n ");

                const payload = {
                    nama: currSession.nama,
                    kelas: currSession.kelas,
                    tanggal: currSession.tanggal,
                    nilai: finalNilai,
                    pelanggaran: currSession.cheatCount,
                    keterangan: keterangan,
                    jawabanEsai: jawabanEsai,
                    rincianJawaban: rincianJawaban
                };

                // Send to GS
                fetch(CONFIG.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    localStorage.removeItem(CONFIG.storageKey);
                    setSession(prev => ({ ...prev, finalScore: finalNilai, keterangan: keterangan }));
                    setView("result");
                }).catch((err) => {
                    alert("Gagal mengirim data. Hubungi Pengawas!");
                    console.error(err);
                    // Tetap arahkan ke result meski error agar UX tdk stuck
                    localStorage.removeItem(CONFIG.storageKey);
                    setSession(prev => ({ ...prev, finalScore: finalNilai, keterangan: "Submit Error" }));
                    setView("result");
                });
            };

            // ==========================================
            // RENDERERS
            // ==========================================
            
            // Format time
            const formatTime = (sec) => {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const isAnswered = (q) => {
                if (!q.userAnswer) return false;
                if (q.type === 'complex') return q.userAnswer.length > 0;
                if (q.type === 'matching') return q.userAnswer.every(a => a !== "");
                return String(q.userAnswer).trim() !== "";
            };

            if (view === "login") {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4 relative z-10">
                        {/* Modal Intercept */}
                        {modal.show && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
                                <div className="bg-white p-6 rounded-xl shadow-2xl max-w-md text-center">
                                    <IconAlert />
                                    <p className="text-gray-800 text-lg mb-6">{modal.message}</p>
                                    <div className="flex justify-center gap-4">
                                        <button onClick={() => { localStorage.removeItem(CONFIG.storageKey); setModal({show:false}); }} className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded font-medium">Mulai Ulang (Hapus Progres)</button>
                                        <button onClick={modal.onConfirm} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium">Lanjutkan Ujian</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-xl shadow-2xl overflow-hidden max-w-md w-full">

                                <h1 className="text-3xl font-bold mb-1">{CONFIG.mapel}</h1>
                                <p className="text-blue-100 text-sm">{CONFIG.jenisUjian} | Kelas {CONFIG.kelas}</p>
                            </div>
                            <form className="p-6 space-y-4" onSubmit={(e) => {
                                e.preventDefault();
                                const fd = new FormData(e.target);
                                startExam({
                                    nama: fd.get('nama').toUpperCase(),
                                    kelas: fd.get('kelas').toUpperCase(),
                                    tanggal: fd.get('tanggal'),
                                    seed: Date.now() // For unique shuffle
                                });
                            }}>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                                    <input required name="nama" type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan Nama..." />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                                    <input required name="kelas" type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: VII-A" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Tanggal Ujian</label>
                                    <input required name="tanggal" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>
                                <div className="pt-4">
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg flex justify-center items-center">
                                        <IconCheck /> <span className="ml-2">Mulai Ujian</span>
                                    </button>
                                </div>
                                <p className="text-xs text-center text-gray-500 mt-4">
                                    Sistem Anti-Curang Aktif. Ujian berjalan dalam mode Fullscreen.
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === "submitting") {
                return (
                    <div className="flex items-center justify-center min-h-screen text-white flex-col">
                        <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white mb-4"></div>
                        <h2 className="text-2xl font-bold">Menyimpan dan Mengumpulkan Ujian...</h2>
                        <p className="text-cyan-100 mt-2">Mohon jangan tutup halaman ini.</p>
                    </div>
                )
            }

            if (view === "result") {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full">
                            <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                <IconCheck />
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai</h2>
                            <p className="text-gray-600 mb-6">{session.nama} | Kelas {session.kelas}</p>
                            
                            <div className="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6">
                                <p className="text-sm text-gray-500 uppercase font-semibold">Skor Akhir (PG & Menjodohkan)</p>
                                <p className="text-5xl font-extrabold text-blue-600">{session.finalScore}</p>
                                <p className="text-xs text-gray-400 mt-2">*Nilai esai akan ditambahkan manual oleh guru</p>
                            </div>
                            
                            <p className="text-sm text-gray-500 bg-gray-100 p-2 rounded">
                                Keterangan: {session.keterangan}
                            </p>
                            
                            <button onClick={() => window.close()} className="mt-6 text-sm text-red-500 hover:underline">Tutup Jendela Ini</button>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // EXAM VIEW RENDERING
            // ==========================================
            const currentQ = questions[currentQIndex];

            const handleAnswerChange = (val) => {
                setQuestions(prev => {
                    const newQ = [...prev];
                    newQ[currentQIndex].userAnswer = val;
                    return newQ;
                });
            };

            const handleComplexChange = (option, checked) => {
                setQuestions(prev => {
                    const newQ = [...prev];
                    let currentAns = newQ[currentQIndex].userAnswer || [];
                    if (checked) currentAns = [...currentAns, option];
                    else currentAns = currentAns.filter(a => a !== option);
                    newQ[currentQIndex].userAnswer = currentAns;
                    return newQ;
                });
            };

            const handleMatchingChange = (pairIndex, val) => {
                setQuestions(prev => {
                    const newQ = [...prev];
                    let currentAns = [...(newQ[currentQIndex].userAnswer || [])];
                    currentAns[pairIndex] = val;
                    newQ[currentQIndex].userAnswer = currentAns;
                    return newQ;
                });
            }

            const checkImgStr = (str) => {
                return str && typeof str === 'string' && (str.startsWith('http') || str.startsWith('https://placehold'));
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-gray-100 overflow-hidden relative">
                    
                    {/* CUSTOM MODAL OVERLAY (To prevent React tree flashing, we keep it here unconditionally but hidden via CSS or conditionally render) */}
                    {modal.show && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[9999]">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm text-center">
                                <IconAlert />
                                <h3 className="text-xl font-bold text-gray-900 mb-2">PERHATIAN!</h3>
                                <p className="text-gray-700 mb-6 whitespace-pre-line">{modal.message}</p>
                                <div className="flex justify-center gap-4">
                                    {modal.type === "confirmSubmit" && (
                                        <button onClick={() => setModal({show:false})} className="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded font-medium">Batal</button>
                                    )}
                                    <button onClick={modal.onConfirm} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium">
                                        {modal.type === "confirmSubmit" ? "Ya, Kumpulkan!" : "Mengerti"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <div className="flex-1 flex flex-col h-full relative overflow-y-auto">
                        
                        {/* Header */}
                        <div className="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
                            <div>
                                <h2 className="text-lg font-bold text-gray-800">{CONFIG.mapel}</h2>
                                <p className="text-xs text-gray-500">{session?.nama} - Kelas {session?.kelas}</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-xs text-gray-400 flex items-center"><IconSave /> Auto-Save Aktif</span>
                                <div className={`text-lg font-bold flex items-center px-3 py-1 rounded ${session?.timeRemaining < 300 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-blue-100 text-blue-700'}`}>
                                    <IconTime /> {formatTime(session?.timeRemaining || 0)}
                                </div>
                            </div>
                        </div>

                        {/* Question Area */}
                        <div className="p-6 flex-1 max-w-4xl mx-auto w-full">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
                                <div className="flex gap-4">
                                    <div className="bg-blue-600 text-white font-bold h-10 w-10 flex-shrink-0 flex items-center justify-center rounded-lg text-lg">
                                        {currentQIndex + 1}
                                    </div>
                                    <div className="flex-1 w-full overflow-hidden">
                                        {/* Soal Content Render */}
                                        <div className="text-gray-800 text-lg mb-4" dangerouslySetInnerHTML={{ __html: currentQ.question }}></div>
                                        
                                        {/* Image for Question if any */}
                                        {currentQ.image && (
                                            <img src={currentQ.image} alt="Soal Image" className="max-w-full h-auto rounded-lg mb-4 border" />
                                        )}

                                        {/* Render Options Based on Type */}
                                        
                                        {/* TYPE: MC */}
                                        {currentQ.type === 'mc' && (
                                            <div className={currentQ.options.some(checkImgStr) ? "grid grid-cols-1 md:grid-cols-2 gap-4 mt-6" : "space-y-3 mt-6"}>
                                                {currentQ.options.map((opt, i) => {
                                                    const isImg = checkImgStr(opt);
                                                    const isChecked = currentQ.userAnswer === opt;
                                                    return (
                                                        <label key={i} className={`flex items-center p-3 rounded-lg border-2 cursor-pointer transition-all ${isChecked ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                                            <input type="radio" name={`q_${currentQ.id}`} checked={isChecked} onChange={() => handleAnswerChange(opt)} className="w-5 h-5 text-blue-600 hidden md:block mr-3" />
                                                            {isImg ? (
                                                                <img src={opt} className="w-full h-auto object-cover rounded" alt="opsi" />
                                                            ) : (
                                                                <div className="flex-1 w-full overflow-x-auto" dangerouslySetInnerHTML={{ __html: opt }}></div>
                                                            )}
                                                        </label>
                                                    )
                                                })}
                                            </div>
                                        )}

                                        {/* TYPE: COMPLEX MC */}
                                        {currentQ.type === 'complex' && (
                                            <div className="space-y-3 mt-6">
                                                {currentQ.options.map((opt, i) => {
                                                    const isChecked = currentQ.userAnswer && currentQ.userAnswer.includes(opt);
                                                    return (
                                                        <label key={i} className={`flex items-center p-3 rounded-lg border-2 cursor-pointer transition-all ${isChecked ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                                            <input type="checkbox" checked={isChecked} onChange={(e) => handleComplexChange(opt, e.target.checked)} className="w-5 h-5 text-blue-600 mr-3 rounded" />
                                                            <div className="flex-1" dangerouslySetInnerHTML={{ __html: opt }}></div>
                                                        </label>
                                                    )
                                                })}
                                            </div>
                                        )}

                                        {/* TYPE: SHORT ANSWER */}
                                        {currentQ.type === 'short_answer' && (
                                            <div className="mt-6">
                                                <input type="text" value={currentQ.userAnswer || ""} onChange={(e) => handleAnswerChange(e.target.value)} className="w-full p-4 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-0 outline-none text-lg" placeholder="Ketik jawaban singkat Anda di sini..." />
                                            </div>
                                        )}

                                        {/* TYPE: ESSAY */}
                                        {currentQ.type === 'essay' && (
                                            <div className="mt-6">
                                                <textarea rows={6} value={currentQ.userAnswer || ""} onChange={(e) => handleAnswerChange(e.target.value)} className="w-full p-4 border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none resize-none" placeholder="Ketik jawaban uraian Anda secara lengkap..."></textarea>
                                            </div>
                                        )}

                                        {/* TYPE: MATCHING */}
                                        {currentQ.type === 'matching' && (
                                            <div className="mt-6 space-y-4">
                                                {currentQ.pairs.map((pair, idx) => (
                                                    <div key={idx} className="flex flex-col md:flex-row items-center md:items-stretch gap-2 bg-gray-50 p-3 rounded border">
                                                        <div className="flex-1 bg-white p-3 rounded shadow-sm border font-medium w-full text-center md:text-left" dangerouslySetInnerHTML={{ __html: pair.premise }}></div>
                                                        <div className="flex items-center justify-center w-full md:w-auto p-2 font-bold text-gray-400">PASANGAN:</div>
                                                        <div className="flex-1 w-full">
                                                            <select value={(currentQ.userAnswer && currentQ.userAnswer[idx]) || ""} onChange={(e) => handleMatchingChange(idx, e.target.value)} className="w-full h-full p-3 bg-white border rounded shadow-sm outline-none focus:ring-2 focus:ring-blue-500 font-arabic text-lg text-right" dir="rtl">
                                                                <option value="" disabled>--- Pilih Pasangan ---</option>
                                                                {currentQ.shuffledAnswers.map((ans, aIdx) => (
                                                                    <option key={aIdx} value={ans}>{ans}</option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Prev / Next Navigation footer */}
                        <div className="bg-white border-t p-4 flex justify-between items-center sticky bottom-0 z-10 shadow-up">
                            <button onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))} disabled={currentQIndex === 0} className={`px-6 py-2 rounded-lg font-semibold ${currentQIndex === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300'}`}>
                                &larr; Sebelumnya
                            </button>
                            
                            {currentQIndex === questions.length - 1 ? (
                                <button onClick={() => setModal({show:true, type:"confirmSubmit", message: "Apakah Anda yakin ingin mengumpulkan ujian ini sekarang? Pastikan semua soal telah terjawab.", onConfirm: () => forceSubmit(session, questions, "Selesai Normal")})} className="px-8 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-lg">
                                    Selesai & Kumpulkan
                                </button>
                            ) : (
                                <button onClick={() => setCurrentQIndex(prev => Math.min(questions.length - 1, prev + 1))} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow">
                                    Selanjutnya &rarr;
                                </button>
                            )}
                        </div>

                    </div>

                    {/* SIDEBAR: Question Navigation Grid */}
                    <div className="w-full md:w-72 bg-white border-l shadow-lg flex flex-col h-48 md:h-full z-20">
                        <div className="bg-gray-800 text-white p-4 font-bold text-center">Navigasi Soal</div>
                        <div className="p-4 overflow-y-auto flex-1 grid grid-cols-5 md:grid-cols-4 gap-2 content-start">
                            {questions.map((q, idx) => {
                                const answered = isAnswered(q);
                                const active = idx === currentQIndex;
                                return (
                                    <button key={idx} onClick={() => setCurrentQIndex(idx)}
                                        className={`h-10 w-full rounded flex items-center justify-center font-bold text-sm transition-all border-2
                                            ${answered ? 'bg-green-500 border-green-600 text-white' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'}
                                            ${active ? 'ring-4 ring-blue-300 ring-opacity-50 border-blue-600' : ''}
                                        `}>
                                        {idx + 1}
                                    </button>
                                );
                            })}
                        </div>
                        <div className="p-4 bg-gray-50 border-t text-xs space-y-2">
                            <div className="flex items-center"><div className="w-4 h-4 bg-green-500 border border-green-600 rounded mr-2"></div> Sudah Dijawab</div>
                            <div className="flex items-center"><div className="w-4 h-4 bg-white border-2 border-gray-300 rounded mr-2"></div> Belum Dijawab</div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
