    // Algoritma Fisher-Yates Shuffle
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // --- KOMPONEN SVG ICON STATIS ---
    function Icon({ name, className = "w-5 h-5" }) {

    // --- KOMPONEN MODAL REUSABLE (ANTI-FLICKER) ---
    function CustomModal({ isOpen, title, message, type = 'info', confirmText = 'OK', cancelText = null, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center">
            <div className={`mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 ${type === 'warning' ? 'bg-amber-500/20 text-amber-400' : type === 'danger' ? 'bg-rose-500/20 text-rose-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
              <Icon name={type === 'warning' || type === 'danger' ? 'alert' : 'shield'} className="w-8 h-8" />
            </div>
            <h3 className="text-xl font-bold text-slate-100 mb-2">{title}</h3>
            <p className="text-slate-300 text-sm mb-6 whitespace-pre-line leading-relaxed">{message}</p>
            <div className="flex justify-center gap-3">
              {cancelText && (
                <button
                  onClick={onCancel}
                  className="px-5 py-2.5 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 font-medium transition"
                >
                  {cancelText}
                </button>
              )}
              <button
                onClick={onConfirm}
                className={`px-6 py-2.5 rounded-xl font-semibold text-white shadow-lg transition ${type === 'danger' ? 'bg-rose-600 hover:bg-rose-500' : 'bg-cyan-600 hover:bg-cyan-500'}`}
              >
                {confirmText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- KOMPONEN UTAMA (APP) ---
    function App() {
      const [examState, setExamState] = useState('login'); // 'login' | 'restore_prompt' | 'exam' | 'finished'
      const [user, setUser] = useState({ name: '', class: 'VII', date: new Date().toISOString().split('T')[0] });
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(EXAM_DURATION_MINUTES * 60);
      const [violations, setViolations] = useState(0);
      const [submissionStatus, setSubmissionStatus] = useState(null);
      const [scoreData, setScoreData] = useState(null);
      const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'info', confirmText: 'OK', cancelText: null, onConfirm: null, onCancel: null });

      const isSubmittingRef = useRef(false);

      // 1. CEK DRAFT LOCALSTORAGE
      useEffect(() => {
        const savedSession = localStorage.getItem(STORAGE_KEY);
        if (savedSession) {
          try {
            const data = JSON.parse(savedSession);
            if (data && data.questions && data.questions.length > 0 && data.user) {
              setExamState('restore_prompt');
            }
          } catch (e) {
            localStorage.removeItem(STORAGE_KEY);
          }
        }
      }, []);

      const handleRestoreSession = () => {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
          setUser(data.user);
          setQuestions(data.questions);
          setAnswers(data.answers || {});
          setTimeLeft(data.timeLeft || EXAM_DURATION_MINUTES * 60);
          setViolations(data.violations || 0);
          setCurrentIndex(data.currentIndex || 0);
          setExamState('exam');
        } catch (e) {
          handleClearSession();
        }
      };

      const handleClearSession = () => {
        localStorage.removeItem(STORAGE_KEY);
        setExamState('login');
      };

      // 2. MULAI UJIAN BARU (ACAK SOAL DENGAN FISHER-YATES)
      const handleStartNewExam = (e) => {
        e.preventDefault();
        if (!user.name.trim()) {
          setModal({
            isOpen: true,
            title: "Data Belum Lengkap",
            message: "Silakan isi Nama Lengkap Anda terlebih dahulu.",
            type: "warning",
            confirmText: "Mengerti",
            onConfirm: () => setModal(m => ({ ...m, isOpen: false }))
          });
          return;
        }

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        const shuffled = rawQuestionsData.map(q => {
          if (q.type === 'mc') {
            return { ...q, options: shuffleArray(q.options) };
          }
          return q;
        });
        const finalShuffledQuestions = shuffleArray(shuffled);

        setQuestions(finalShuffledQuestions);
        setAnswers({});
        setTimeLeft(EXAM_DURATION_MINUTES * 60);
        setViolations(0);
        setCurrentIndex(0);
        setExamState('exam');
      };

      // 3. EFEK ANTI-KECURANGAN (STRICT ANTI-CHEAT)
      useEffect(() => {
        if (examState !== 'exam') return;

        const handleViolation = () => {
          if (isSubmittingRef.current) return;

          setViolations(prev => {
            const newCount = prev + 1;
            if (newCount === 1) {
              setModal({
                isOpen: true,
                title: "⚠️ PERINGATAN KECURANGAN!",
                message: "Anda terdeteksi meninggalkan halaman atau keluar dari mode Fullscreen!\n\nIni adalah PERINGATAN PERTAMA. Jika melakukan sekali lagi, ujian akan OTOMATIS DIKUNCI dan dikumpulkan.",
                type: "warning",
                confirmText: "Kembali Penuh Tanggung Jawab",
                onConfirm: () => {
                  if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                  }
                  setModal(m => ({ ...m, isOpen: false }));
                }
              });
            } else if (newCount >= 2) {
              setModal({
                isOpen: true,
                title: "🔒 UJIAN DIKUNCI!",
                message: "Pelanggaran kedua terdeteksi. Lembar ujian Anda dikunci dan disubmit secara otomatis ke server.",
                type: "danger",
                confirmText: "Kumpulkan Nilai",
                onConfirm: () => {
                  setModal(m => ({ ...m, isOpen: false }));
                  handleForceSubmit(newCount);
                }
              });
            }
            return newCount;
          });
        };

        const handleVisibilityChange = () => { if (document.hidden) handleViolation(); };
        const handleFullscreenChange = () => { if (!document.fullscreenElement && examState === 'exam') handleViolation(); };
        const handleContextMenu = (e) => e.preventDefault();
        const handleCopyPaste = (e) => {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('contextmenu', handleContextMenu);
        document.addEventListener('copy', handleCopyPaste);
        document.addEventListener('paste', handleCopyPaste);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('contextmenu', handleContextMenu);
          document.removeEventListener('copy', handleCopyPaste);
          document.removeEventListener('paste', handleCopyPaste);
        };
      }, [examState]);

      // 4. TIMER & SIMPAN OTOMATIS
      useEffect(() => {
        if (examState !== 'exam') return;

        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleForceSubmit(violations);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [examState, violations]);

      useEffect(() => {
        if (examState === 'exam' && questions.length > 0) {
          const payload = { user, questions, answers, timeLeft, violations, currentIndex };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        }
      }, [examState, questions, answers, timeLeft, violations, currentIndex, user]);

      // 5. INPUT JAWABAN
      const handleAnswerSelect = (questionId, value, type) => {
        setAnswers(prev => {
          const newAns = { ...prev };
          if (type === 'complex') {
            const currentList = newAns[questionId] || [];
            if (currentList.includes(value)) {
              newAns[questionId] = currentList.filter(v => v !== value);
            } else {
              newAns[questionId] = [...currentList, value];
            }
          } else if (type === 'matching') {
            const { premiseId, targetValue } = value;
            const currentMatch = newAns[questionId] || {};
            newAns[questionId] = { ...currentMatch, [premiseId]: targetValue };
          } else {
            newAns[questionId] = value;
          }
          return newAns;
        });
      };

      // 6. PENILAIAN OTOMATIS & REKAP DATA
      const calculateResults = (finalViolations = violations) => {
        let earnedPoints = 0;
        let totalMaxQuestions = rawQuestionsData.length; // 26 Soal

        let detailArray = [];

        rawQuestionsData.forEach((q) => {
          const userAns = answers[q.id];

          if (q.type === 'mc') {
            const isCorrect = userAns && userAns.toString().trim() === q.answer.toString().trim();
            if (isCorrect) earnedPoints += 1;

            if (!userAns) {
              detailArray.push(`Soal ${q.id}: KOSONG`);
            } else if (isCorrect) {
              detailArray.push(`Soal ${q.id}: BENAR`);
            } else {
              detailArray.push(`Soal ${q.id}: SALAH (Pilih: [${typeof userAns === 'object' ? userAns.text : userAns}], Kunci: [${q.answer}])`);
            }
          } else if (q.type === 'complex') {
            const userList = userAns || [];
            const keyList = q.answer || [];
            const isExactMatch = userList.length === keyList.length && userList.every(v => keyList.includes(v));
            
            if (isExactMatch) earnedPoints += 1;

            if (userList.length === 0) {
              detailArray.push(`Soal ${q.id}: KOSONG`);
            } else if (isExactMatch) {
              detailArray.push(`Soal ${q.id} (Kompleks): BENAR`);
            } else {
              detailArray.push(`Soal ${q.id} (Kompleks): SALAH (Pilih: [${userList.join(', ')}], Kunci: [${keyList.join(', ')}])`);
            }
          } else if (q.type === 'matching') {
            const userMatch = userAns || {};
            let correctCount = 0;
            const premises = q.premises || [];
            let matchDetails = [];

            premises.forEach(p => {
              const selected = userMatch[p.id];
              const isRight = selected === p.key;
              if (isRight) correctCount++;
              
              const pNo = p.label.split('.')[0].trim();
              if (!selected) {
                matchDetails.push(`Premis${pNo}=KOSONG`);
              } else if (isRight) {
                matchDetails.push(`Premis${pNo}=${selected} (BENAR)`);
              } else {
                matchDetails.push(`Premis${pNo}=${selected} (SALAH, Kunci: ${p.key})`);
              }
            });

            const matchRatio = premises.length > 0 ? correctCount / premises.length : 0;
            earnedPoints += matchRatio;
            detailArray.push(`Soal ${q.id} (Menjodohkan): [${matchDetails.join(' | ')}]`);
          }
        });

        const finalScore = Math.round((earnedPoints / totalMaxQuestions) * 100);

        return {
          score: finalScore,
          jawabanEsai: "- (Tidak Ada Soal Esai)",
          rincianJawaban: detailArray.join(' | '),
          violationsCount: finalViolations
        };
      };

      // 7. PENGIRIMAN DATA KE GOOGLE SHEETS
      const sendDataToGoogleSheets = async (results) => {
        setSubmissionStatus('submitting');
        const payload = {
          nama: user.name,
          kelas: user.class,
          tanggal: user.date,
          skor: results.score,
          pelanggaran: results.violationsCount,
          keterangan: results.violationsCount >= 2 ? "AUTO-SUBMIT (DILANGGAR)" : "SELESAI TEPAT WAKTU",
          jawabanEsai: results.jawabanEsai,
          rincianJawaban: results.rincianJawaban,
          debugJson: JSON.stringify(answers)
        };

        try {
          if (GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL !== "URL_APPS_SCRIPT_ANDA") {
            await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload)
            });
          }
          setSubmissionStatus('success');
        } catch (err) {
          setSubmissionStatus('error');
        } finally {
          localStorage.removeItem(STORAGE_KEY);
        }
      };

      const handleForceSubmit = (finalViolations = violations) => {
        if (isSubmittingRef.current) return;
        isSubmittingRef.current = true;
        
        const results = calculateResults(finalViolations);
        setScoreData(results);
        setExamState('finished');
        sendDataToGoogleSheets(results);
      };

      const confirmSubmitExam = () => {
        setModal({
          isOpen: true,
          title: "Konfirmasi Kumpulkan Ujian",
          message: "Apakah Anda yakin ingin mengumpulkan seluruh lembar jawaban sekarang?",
          type: "info",
          confirmText: "Ya, Kumpulkan!",
          cancelText: "Belum, Cek Lagi",
          onCancel: () => setModal(m => ({ ...m, isOpen: false })),
          onConfirm: () => {
            setModal(m => ({ ...m, isOpen: false }));
            handleForceSubmit();
          }
        });
      };

      const isQuestionAnswered = (q) => {
        const ans = answers[q.id];
        if (!ans) return false;
        if (q.type === 'complex') return ans.length > 0;
        if (q.type === 'matching') {
          const premises = q.premises || [];
          return premises.every(p => ans[p.id]);
        }
        return ans.toString().trim() !== '';
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // --- RENDER LOGIN ---
      if (examState === 'login') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-lg w-full bg-slate-900/90 border border-cyan-500/30 backdrop-blur-xl rounded-3xl p-8 shadow-2xl">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-gradient-to-tr from-cyan-600 to-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-cyan-500/30 mb-4">
                  <Icon name="shield" className="w-10 h-10 text-white" />
                </div>
                <h1 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 bg-clip-text text-transparent">
                  BAHASA ARAB
                </h1>
                <p className="text-slate-400 text-sm font-semibold mt-1">
                  SUMATIF AKHIR JENJANG (SAJ) 2026/2027 • KELAS VII
                </p>
              </div>

              <form onSubmit={handleStartNewExam} className="space-y-5">
                <div>
                  <label className="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Nama Lengkap Siswa</label>
                  <div className="relative">
                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <Icon name="user" />
                    </span>
                    <input
                      type="text"
                      required
                      placeholder="Masukkan Nama Lengkap"
                      value={user.name}
                      onChange={e => setUser({ ...user, name: e.target.value })}
                      className="w-full pl-11 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Kelas</label>
                    <input
                      type="text"
                      value={user.class}
                      onChange={e => setUser({ ...user, class: e.target.value })}
                      className="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-cyan-500 transition"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Tanggal Ujian</label>
                    <input
                      type="date"
                      value={user.date}
                      onChange={e => setUser({ ...user, date: e.target.value })}
                      className="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-cyan-500 transition"
                    />
                  </div>
                </div>

                <div className="p-4 bg-cyan-950/50 border border-cyan-800/50 rounded-xl text-cyan-300 text-xs leading-relaxed space-y-1">
                  <p className="font-bold">📌 Ketentuan Ujian:</p>
                  <p>• Waktu pengerjaan: {EXAM_DURATION_MINUTES} Menit.</p>
                  <p>• Ujian ini terdiri dari 25 Soal Pilihan Ganda & 1 Soal Menjodohkan.</p>
                </div>

                <button
                  type="submit"
                  className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition transform hover:-translate-y-0.5"
                >
                  Mulai Ujian Sekarang
                </button>
              </form>
            </div>

            <CustomModal {...modal} />
          </div>
        );
      }

      // --- RENDER RESTORE SESI ---
      if (examState === 'restore_prompt') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-amber-500/40 rounded-3xl p-6 text-center shadow-2xl">
              <div className="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <Icon name="alert" className="w-8 h-8" />
              </div>
              <h2 className="text-2xl font-bold text-slate-100 mb-2">Sesi Tersimpan Ditemukan!</h2>
              <p className="text-slate-300 text-sm mb-6 leading-relaxed">
                Terdapat draf ujian yang belum selesai disubmit. Apakah Anda ingin melanjutkan pengerjaan?
              </p>
              <div className="space-y-3">
                <button
                  onClick={handleRestoreSession}
                  className="w-full py-3.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl shadow-lg transition"
                >
                  Lanjutkan Ujian
                </button>
                <button
                  onClick={handleClearSession}
                  className="w-full py-3 border border-slate-700 text-slate-400 hover:bg-slate-800 font-semibold rounded-xl transition"
                >
                  Mulai Ulang (Hapus Progres)
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- RENDER SELESAI ---
      if (examState === 'finished') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-xl w-full bg-slate-900/90 border border-slate-700 backdrop-blur-xl rounded-3xl p-8 shadow-2xl text-center">
              <div className="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <Icon name="check" className="w-10 h-10" />
              </div>
              <h2 className="text-3xl font-extrabold text-slate-100 mb-1">Ujian Berhasil Dikumpulkan</h2>
              <p className="text-slate-400 text-sm mb-6">Jawaban Anda telah tercatat dengan aman di server.</p>

              {scoreData && (
                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 mb-6">
                  <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Nilai Otomatis Akhir</p>
                  <div className="text-5xl font-black bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent mb-4">
                    {scoreData.score} <span className="text-lg text-slate-500 font-normal">/ 100</span>
                  </div>
                  <div className="grid grid-cols-2 gap-4 text-left text-xs bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                    <div>
                      <span className="text-slate-400">Nama:</span>
                      <p className="font-semibold text-slate-200">{user.name}</p>
                    </div>
                    <div>
                      <span className="text-slate-400">Kelas:</span>
                      <p className="font-semibold text-slate-200">{user.class}</p>
                    </div>
                    <div>
                      <span className="text-slate-400">Pelanggaran:</span>
                      <p className={`font-semibold ${scoreData.violationsCount > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {scoreData.violationsCount} Kali
                      </p>
                    </div>
                    <div>
                      <span className="text-slate-400">Status Server:</span>
                      <p className="font-semibold text-cyan-400">
                        {submissionStatus === 'submitting' ? 'Mengirim Data...' : submissionStatus === 'success' ? 'Tersimpan' : 'Selesai'}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              <button
                onClick={() => setExamState('login')}
                className="px-8 py-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold rounded-xl transition"
              >
                Kembali ke Hal Muka
              </button>
            </div>
          </div>
        );
      }

      // --- RENDER AREA UJIAN (EXAM UI) ---
      const currentQuestion = questions[currentIndex];
      if (!currentQuestion) return null;

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER CBT */}
          <header className="bg-slate-900/90 border-b border-cyan-500/20 sticky top-0 z-40 backdrop-blur-md px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-lg font-extrabold text-cyan-400 tracking-tight">BAHASA ARAB</h1>
                <p className="text-xs text-slate-400">SUMATIF AKHIR JENJANG (SAJ) 2026/2027 • KELAS {user.class}</p>
              </div>

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 px-4 py-2 bg-slate-800 border border-cyan-500/40 rounded-xl text-cyan-300 font-mono text-sm font-bold shadow-inner">
                  <Icon name="clock" className="text-cyan-400 animate-pulse" />
                  <span>{formatTime(timeLeft)}</span>
                </div>

                {violations > 0 && (
                  <div className="px-3 py-1.5 bg-amber-500/20 border border-amber-500/40 rounded-xl text-amber-300 text-xs font-semibold flex items-center gap-1.5">
                    <Icon name="alert" className="w-4 h-4" />
                    <span>Pelanggaran: {violations}/2</span>
                  </div>
                )}

                <button
                  onClick={confirmSubmitExam}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg transition"
                >
                  Selesai & Kumpulkan
                </button>
              </div>
            </div>
          </header>

          {/* MAIN AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            {/* AREA KARTU SOAL */}
            <section className="lg:col-span-3 bg-slate-900/80 border border-slate-800 rounded-3xl p-6 md:p-8 flex flex-col justify-between shadow-2xl relative">
              <div>
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <span className="text-xs font-bold text-cyan-400 bg-cyan-950/80 border border-cyan-800/80 px-3 py-1 rounded-lg">
                    SOAL NOMOR {currentIndex + 1} DARI {questions.length}
                  </span>
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    {currentQuestion.type === 'mc' ? (currentQuestion.isImageOptions ? 'Pilihan Ganda Gambar' : 'Pilihan Ganda') : currentQuestion.type === 'complex' ? 'Pilihan Ganda Kompleks' : 'Menjodohkan'}
                  </span>
                </div>

                {/* Gambar Soal (Jika Ada) */}
                {currentQuestion.image && (
                  <div className="mb-6 rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 max-w-lg mx-auto">
                    <img src={currentQuestion.image} alt="Visual Soal" className="w-full object-cover max-h-72" />
                  </div>
                )}

                {/* Teks Soal */}
                <div className="mb-8">
                  <div
                    className={`text-slate-100 text-lg md:text-xl leading-relaxed ${currentQuestion.isArabic ? 'font-arabic text-2xl md:text-3xl text-right leading-loose' : ''}`}
                    dir={currentQuestion.isArabic ? 'rtl' : 'ltr'}
                    dangerouslySetInnerHTML={{ __html: currentQuestion.question }}
                  />
                </div>

                {/* OPSI JAWABAN */}

                {/* TIPE 1A: PILIHAN GANDA GAMBAR (SOAL NO 8) */}
                {currentQuestion.type === 'mc' && currentQuestion.isImageOptions && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {currentQuestion.options.map((opt, idx) => {
                      const isSelected = answers[currentQuestion.id] === opt.image;
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => handleAnswerSelect(currentQuestion.id, opt.image, 'mc')}
                          className={`p-4 rounded-2xl border text-left flex flex-col gap-3 transition-all ${
                            isSelected
                              ? 'bg-cyan-950/80 border-cyan-500 ring-2 ring-cyan-500/50 shadow-lg shadow-cyan-950'
                              : 'bg-slate-800/50 border-slate-700/80 hover:bg-slate-800 hover:border-slate-600'
                          }`}
                        >
                          <div className="flex items-center justify-between w-full">
                            <span className="font-bold text-sm text-cyan-300">{opt.label}</span>
                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${isSelected ? 'border-cyan-400 bg-cyan-500' : 'border-slate-500'}`}>
                              {isSelected && <div className="w-2 h-2 rounded-full bg-white"></div>}
                            </div>
                          </div>
                          <div className="rounded-xl overflow-hidden border border-slate-700/80 bg-slate-950">
                            <img src={opt.image} alt={opt.text} className="w-full h-36 object-cover" />
                          </div>
                          <span className="text-xs text-slate-300 font-medium">{opt.text}</span>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* TIPE 1B: PILIHAN GANDA BIASA (TEKS) */}
                {currentQuestion.type === 'mc' && !currentQuestion.isImageOptions && (
                  <div className="grid grid-cols-1 gap-3.5">
                    {currentQuestion.options.map((opt, idx) => {
                      const isSelected = answers[currentQuestion.id] === opt;
                      const isOptArabic = /[\u0600-\u06FF]/.test(opt);
                      return (
                        <button
                          key={idx}
                          onClick={() => handleAnswerSelect(currentQuestion.id, opt, 'mc')}
                          className={`w-full p-4 rounded-2xl border text-left flex items-center justify-between transition-all ${isSelected ? 'bg-cyan-950/80 border-cyan-500 ring-2 ring-cyan-500/50' : 'bg-slate-800/50 border-slate-700/80 hover:bg-slate-800'}`}
                        >
                          <div className={`flex items-center gap-4 w-full ${isOptArabic ? 'flex-row-reverse text-right' : ''}`}>
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-sm shrink-0 ${isSelected ? 'bg-cyan-500 text-white' : 'bg-slate-700 text-slate-300'}`}>
                              {String.fromCharCode(65 + idx)}
                            </div>
                            <span className={`text-base ${isOptArabic ? 'font-arabic text-2xl w-full' : 'text-slate-200'}`}>
                              {opt}
                            </span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* TIPE 2: PILIHAN GANDA KOMPLEKS */}
                {currentQuestion.type === 'complex' && (
                  <div className="grid grid-cols-1 gap-3.5">
                    {currentQuestion.options.map((opt, idx) => {
                      const currentList = answers[currentQuestion.id] || [];
                      const isChecked = currentList.includes(opt);
                      const isOptArabic = /[\u0600-\u06FF]/.test(opt);
                      return (
                        <button
                          key={idx}
                          onClick={() => handleAnswerSelect(currentQuestion.id, opt, 'complex')}
                          className={`w-full p-4 rounded-2xl border text-left flex items-center justify-between transition-all ${isChecked ? 'bg-cyan-950/80 border-cyan-500 ring-2 ring-cyan-500/50' : 'bg-slate-800/50 border-slate-700/80 hover:bg-slate-800'}`}
                        >
                          <div className={`flex items-center gap-4 w-full ${isOptArabic ? 'flex-row-reverse text-right' : ''}`}>
                            <div className={`w-6 h-6 rounded-md border flex items-center justify-center shrink-0 ${isChecked ? 'bg-cyan-500 border-cyan-400 text-white' : 'border-slate-600 bg-slate-800'}`}>
                              {isChecked && <Icon name="check" className="w-4 h-4" />}
                            </div>
                            <span className={`text-base ${isOptArabic ? 'font-arabic text-2xl w-full' : 'text-slate-200'}`}>
                              {opt}
                            </span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* TIPE 3: MENJODOHKAN */}
                {currentQuestion.type === 'matching' && (
                  <div className="space-y-4">
                    {(currentQuestion.premises || []).map((p) => {
                      const currentSelected = (answers[currentQuestion.id] || {})[p.id] || '';
                      return (
                        <div key={p.id} className="p-4 bg-slate-800/60 border border-slate-700/80 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                          <div className={`md:w-1/2 ${p.isArabic ? 'font-arabic text-2xl text-right' : 'text-slate-200 font-medium'}`}>
                            {p.label}
                          </div>
                          <div className="md:w-1/2">
                            <select
                              value={currentSelected}
                              onChange={e => handleAnswerSelect(currentQuestion.id, { premiseId: p.id, targetValue: e.target.value }, 'matching')}
                              className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-cyan-500 transition"
                            >
                              <option value="">-- Pilih Pasangan Jawaban --</option>
                              {currentQuestion.targetOptions.map((opt, oIdx) => (
                                <option key={oIdx} value={opt}>{opt}</option>
                              ))}
                            </select>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* NAVIGASI SEBELUMNYA / SELANJUTNYA */}
              <div className="flex items-center justify-between mt-10 pt-6 border-t border-slate-800">
                <button
                  onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                  disabled={currentIndex === 0}
                  className={`px-5 py-3 rounded-xl font-bold text-sm flex items-center gap-2 transition ${currentIndex === 0 ? 'opacity-40 cursor-not-allowed bg-slate-800 text-slate-500' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
                >
                  <Icon name="chevronLeft" />
                  Sebelumnya
                </button>

                {currentIndex < questions.length - 1 ? (
                  <button
                    onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                    className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm rounded-xl shadow-lg flex items-center gap-2 transition"
                  >
                    Selanjutnya
                    <Icon name="chevronRight" />
                  </button>
                ) : (
                  <button
                    onClick={confirmSubmitExam}
                    className="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg flex items-center gap-2 transition"
                  >
                    Selesai & Kumpulkan
                  </button>
                )}
              </div>
            </section>

            {/* NAVIGASI KOTAK NOMOR SOAL */}
            <aside className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col h-fit">
              <div className="flex items-center gap-2 mb-4 pb-3 border-b border-slate-800 text-slate-200 font-bold text-sm">
                <Icon name="grid" className="text-cyan-400" />
                <span>Navigasi Nomor Soal</span>
              </div>

              <div className="grid grid-cols-5 gap-2.5 max-h-96 overflow-y-auto pr-1">
                {questions.map((q, idx) => {
                  const answered = isQuestionAnswered(q);
                  const isActive = idx === currentIndex;
                  return (
                    <button
                      key={idx}
                      onClick={() => setCurrentIndex(idx)}
                      className={`h-11 rounded-xl font-bold text-sm flex items-center justify-center transition-all ${isActive ? 'ring-2 ring-cyan-400 ring-offset-2 ring-offset-slate-900 z-10' : ''} ${answered ? 'bg-emerald-600 text-white font-extrabold shadow-md' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'}`}
                    >
                      {idx + 1}
                    </button>
                  );
                })}
              </div>

              <div className="mt-6 pt-4 border-t border-slate-800 space-y-2 text-xs text-slate-400">
                <div className="flex items-center gap-2">
                  <div className="w-3.5 h-3.5 rounded bg-emerald-600"></div>
                  <span>Sudah Dijawab Lengkap</span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="w-3.5 h-3.5 rounded bg-slate-800 border border-slate-700"></div>
                  <span>Belum Dijawab Sempurna</span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="w-3.5 h-3.5 rounded bg-slate-800 ring-2 ring-cyan-400"></div>
                  <span>Nomor Soal Aktif</span>
                </div>
              </div>
            </aside>
          </main>

          <CustomModal {...modal} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
